
name: Build EMI Sniffer UF2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile firmware
        working-directory: Firmware
        run: pio run -e rp2354

      - name: Rename UF2 file
        run: |
          mkdir -p output
          cp Firmware/.pio/build/rp2354/firmware.uf2 output/EMI_sniffer.uf2

      - name: Upload UF2 file
        uses: actions/upload-artifact@v6
        with:
          name: EMI_sniffer
          path: output/EMI_sniffer.uf2
          if-no-files-found: error
